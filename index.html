<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وَنَــس - لعبة تذكر وش قال</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #0084c7;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-card {
            background: #026ca7;
            border: 4px solid #facc15;
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
            position: relative;
        }

        .brand-header {
            font-size: 44px;
            font-weight: 900;
            color: #facc15;
            margin-bottom: 2px;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: -1px;
        }

        .brand-sub {
            font-size: 15px;
            color: #e0f2fe;
            margin-bottom: 20px;
            font-weight: 700;
        }

        h2 {
            color: #ffffff;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
            font-size: 16px;
            color: #f0f9ff;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #005585;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        input::placeholder {
            color: #93c5fd;
        }

        .counter-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            background: #005585;
            padding: 10px;
            border-radius: 14px;
        }

        .counter-btn {
            background: #facc15;
            color: #000;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #ca8a04;
        }

        .counter-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ca8a04;
        }

        .counter-value {
            font-size: 26px;
            font-weight: 900;
            color: #facc15;
            min-width: 40px;
        }

        button.btn-primary {
            background: #facc15;
            color: #032b43;
            border: none;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 5px 0 #ca8a04;
            transition: all 0.1s ease;
        }

        button.btn-primary:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #ca8a04;
        }

        .timer {
            font-size: 52px;
            color: #facc15;
            font-weight: 900;
            margin: 15px 0;
            text-shadow: 2px 2px 0 #000;
        }

        .badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .badge-impostor { background: #f43f5e; color: #fff; }
        .badge-sniper { background: #fb923c; color: #fff; }
        .badge-citizen { background: #4ade80; color: #042f2e; }

        .words-box {
            background: #005585;
            border: 2px dashed #facc15;
            padding: 15px;
            border-radius: 14px;
            margin: 15px 0;
            text-align: right;
        }

        .words-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            justify-content: center;
        }

        .word-tag {
            background: #facc15;
            color: #032b43;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 15px;
        }

        .score-item {
            background: #005585;
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div id="app"></div>

<script>
    const app = document.getElementById('app');

    // بنك كلمات ضخم ومتنوع لكل فئة لضمان عدم التكرار وعشوائية الكلمات
    const gameDatabase = [
        { 
            category: "المستشفى", 
            wordsPool: ["طوارئ", "عناية", "وصفة", "مغذي", "سماعة", "إبرة", "عمليات", "تحليل", "سرير", "دواء", "مريض", "طبيب", "تمريض", "أشعة", "ضمادة"] 
        },
        { 
            category: "المطار", 
            wordsPool: ["ترانزيت", "أمتعة", "جوازات", "مدرج", "قبطان", "تذكرة", "بوابة", "مضيفة", "إقلاع", "هبوط", "حقائب", "تفتيش", "مسافر", "رحلة", "جواز"] 
        },
        { 
            category: "المطعم", 
            wordsPool: ["منيو", "فاتورة", "تحلية", "حجز", "شيف", "جرسون", "طاولة", "مشروب", "شوربة", "طلب", "حساب", "مقبلات", "إطار", "مذاق", "خدمة"] 
        },
        { 
            category: "السينما", 
            wordsPool: ["تذكرة", "شاشة", "فشار", "صالة", "عرض", "كرسي", "فيلم", "مخرج", "ممثلو", "إضاءة", "سماعات", "ستارة", "حجز", "مقاليد", "موهبة"] 
        },
        { 
            category: "السوبرماركت", 
            wordsPool: ["عربة", "كاشير", "خصم", "مرفق", "منتجات", "عروض", "رفوف", "فاتورة", "أكياس", "سعر", "ميزان", "طابور", "حساب", "استهلاك", "بضاعة"] 
        },
        { 
            category: "ملعب كرة القدم", 
            wordsPool: ["صافرة", "تسلل", "ركلة", "مدرجات", "مدرب", "حكم", "مرمى", "خطأ", "بطاقة", "مهاجم", "دفاع", "استاد", "شوط", "تعادل", "هدف"] 
        },
        { 
            category: "المطبخ", 
            wordsPool: ["مفرمة", "خلاط", "فرن", "بهارات", "مريلة", "سكين", "قدر", "ثلاجة", "صحن", "ملعقة", "موقد", "تلاجة", "غسالة", "طاهي", "وصفة"] 
        },
        { 
            category: "الشاطئ", 
            wordsPool: ["موج", "رمل", "مظلة", "نظارة", "صدف", "بحر", "شمس", "قارب", "سباحة", "منقذ", "كرسي", "غروب", "صيد", "صخرة", "نسيم"] 
        },
        { 
            category: "الجامعة", 
            wordsPool: ["محاضرة", "قاعة", "معدل", "دكتور", "جدول", "اختبار", "تخرج", "مكتبة", "حرم", "بحث", "مقرر", "درجات", "طالب", "تخصص", "مستقبل"] 
        },
        { 
            category: "الفندق", 
            wordsPool: ["استقبال", "مفتاح", "جناح", "خدمة", "مسبح", "غرفة", "حقائب", "مصعد", "حجز", "إفطار", "تنظيف", "مقيم", "بطاقة", "إقامة", "راحة"] 
        }
    ];

    let gameState = {
        players: [],
        totalRounds: 1,
        currentRound: 1,
        impostor: null,
        sniper: null,
        citizens: [],
        currentCategory: '',
        currentRoundWords: [],
        wordsToSay: 2,
        revealQueue: [],
        currentRevealIndex: 0,
        votingQueue: [],
        currentVotingIndex: 0,
        roundSummaryText: ""
    };

    function renderSetup() {
        app.innerHTML = `
            <div class="game-card">
                <div class="brand-header">وَنَــس</div>
                <div class="brand-sub">لعبة تذكر وش قال 🎲</div>
                <h2>عدد اللاعبين (4 على الأقل)</h2>
                <input type="number" id="playerCount" min="4" value="4">
                <button class="btn-primary" id="nextBtn">التالي ⬅️</button>
            </div>
        `;
        document.getElementById('nextBtn').onclick = () => {
            let count = parseInt(document.getElementById('playerCount').value);
            if (isNaN(count) || count < 4) {
                alert('❌ اللعبة تحلى بـ 4 لاعبين على الأقل!');
                return;
            }
            renderNamesInput(count);
        };
    }

    function renderNamesInput(count) {
        let html = `
            <div class="game-card">
                <div class="brand-header">وَنَــس</div>
                <h2>أسماء اللاعبين والجولات</h2>
        `;
        for (let i = 1; i <= count; i++) {
            html += `<input type="text" class="player-name" placeholder="لاعب ${i}" value="لاعب ${i}">`;
        }
        html += `<p style="margin-top:15px; font-weight:700;">عدد الجولات:</p>`;
        html += `<input type="number" id="totalRounds" min="1" value="3">`;
        html += `<button class="btn-primary" id="startBtn">بدء الوناسة 🚀</button></div>`;
        app.innerHTML = html;

        document.getElementById('startBtn').onclick = () => {
            let nameInputs = document.querySelectorAll('.player-name');
            gameState.players = [];
            nameInputs.forEach((input, index) => {
                let name = input.value.trim() || `لاعب ${index + 1}`;
                gameState.players.push({ name, score: 0 });
            });
            gameState.totalRounds = parseInt(document.getElementById('totalRounds').value) || 1;
            gameState.currentRound = 1;
            startRound();
        };
    }

    function startRound() {
        let shuffled = [...gameState.players].sort(() => Math.random() - 0.5);
        
        gameState.impostor = shuffled[0];
        gameState.sniper = shuffled[1];
        gameState.citizens = shuffled.slice(2);

        // اختيار فئة عشوائية
        let randomCatObj = gameDatabase[Math.floor(Math.random() * gameDatabase.length)];
        gameState.currentCategory = randomCatObj.category;

        // اختيار 5 كلمات عشوائية فريدة من بنك كلمات هذه الفئة لتتجدد في كل جولة!
        let shuffledPool = [...randomCatObj.wordsPool].sort(() => Math.random() - 0.5);
        gameState.currentRoundWords = shuffledPool.slice(0, 5);

        gameState.wordsToSay = 2;
        gameState.roundSummaryText = "";

        gameState.revealQueue = [...gameState.players];
        gameState.currentRevealIndex = 0;
        processNextReveal();
    }

    function renderPassDevice(playerName, nextCallback) {
        app.innerHTML = `
            <div class="game-card">
                <div class="brand-header">وَنَــس</div>
                <h2>📱 مرر الجهاز بالسر</h2>
                <p style="font-size: 20px; margin: 20px 0;">أعطِ الجهاز الآن لـ: <br><strong style="color: #facc15; font-size: 28px;">[ ${playerName} ]</strong></p>
                <p style="color: #e0f2fe; font-size: 14px;">تأكد أن الشاشة غير مكشوفة للآخرين! 🤫</p>
                <button class="btn-primary" id="readyBtn">أنا جاهز 👍</button>
            </div>
        `;
        document.getElementById('readyBtn').onclick = nextCallback;
    }

    function processNextReveal() {
        if (gameState.currentRevealIndex < gameState.revealQueue.length) {
            let currentPlayer = gameState.revealQueue[gameState.currentRevealIndex];
            renderPassDevice(currentPlayer.name, () => {
                if (currentPlayer === gameState.impostor) {
                    renderImpostorSetup();
                } else if (currentPlayer === gameState.sniper) {
                    renderSniperMemory();
                } else {
                    renderCitizenInfo(currentPlayer);
                }
            });
        } else {
            renderDiscussionPhase();
        }
    }

    function renderImpostorSetup() {
        app.innerHTML = `
            <div class="game-card">
                <h2>مرحباً ${gameState.impostor.name}</h2>
                <span class="badge badge-impostor">دورك: الامبوستر 🕵️‍♂️</span>
                <p style="margin-bottom: 5px;">الفئة المفتاحيّة: <strong style="color:#facc15;">${gameState.currentCategory}</strong></p>
                
                <div class="words-box">
                    <p style="margin:0 0 5px 0; font-size:14px;">الكلمات الـ 5 العشوائية لهذه الجولة:</p>
                    <div class="words-list">
                        ${gameState.currentRoundWords.map(w => `<span class="word-tag">${w}</span>`).join('')}
                    </div>
                </div>

                <p style="font-size: 15px;">حدد كم كلمة ستتعهد بقولها في المناقشة:</p>
                <div class="counter-box">
                    <button class="counter-btn" id="minusBtn">-</button>
                    <span class="counter-value" id="wordsCounter">${gameState.wordsToSay}</span>
                    <button class="counter-btn" id="plusBtn">+</button>
                </div>

                <button class="btn-primary" id="confirmImpBtn">تأكيد ومتابعة 🔒</button>
            </div>
        `;

        document.getElementById('minusBtn').onclick = () => {
            if (gameState.wordsToSay > 1) {
                gameState.wordsToSay--;
                document.getElementById('wordsCounter').innerText = gameState.wordsToSay;
            }
        };

        document.getElementById('plusBtn').onclick = () => {
            if (gameState.wordsToSay < 5) {
                gameState.wordsToSay++;
                document.getElementById('wordsCounter').innerText = gameState.wordsToSay;
            }
        };

        document.getElementById('confirmImpBtn').onclick = () => {
            gameState.currentRevealIndex++;
            processNextReveal();
        };
    }

    function renderSniperMemory() {
        app.innerHTML = `
            <div class="game-card">
                <h2>مرحباً ${gameState.sniper.name}</h2>
                <span class="badge badge-sniper">دورك: القناص 🎯</span>
                <p>الفئة: <strong style="color:#facc15;">${gameState.currentCategory}</strong></p>
                <p style="color:#facc15; font-size:14px; margin:0;">💡 معلومات سرية: الامبوستر قرر يتكلم بـ <strong>(${gameState.wordsToSay}) كلمات</strong>!</p>
                
                <div class="words-box">
                    <p style="margin:0 0 5px 0; font-size:14px;">احفظ الكلمات الـ 5 (ستختفي بعد 5 ثوانٍ):</p>
                    <div class="words-list">
                        ${gameState.currentRoundWords.map(w => `<span class="word-tag">${w}</span>`).join('')}
                    </div>
                </div>

                <div class="timer" id="timer">5</div>
            </div>
        `;

        let timeLeft = 5;
        let timerInterval = setInterval(() => {
            timeLeft--;
            let timerEl = document.getElementById('timer');
            if (timerEl) timerEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                gameState.currentRevealIndex++;
                processNextReveal();
            }
        }, 1000);
    }

    function renderCitizenInfo(player) {
        app.innerHTML = `
            <div class="game-card">
                <h2>مرحباً ${player.name}</h2>
                <span class="badge badge-citizen">دورك: مواطن 🔍</span>
                <p style="font-size:20px; margin:20px 0;">الفئة (الموضوع): <br><strong style="color:#facc15; font-size:26px;">${gameState.currentCategory}</strong></p>
                <p style="color:#e0f2fe; font-size:14px;">مهمتك: ركّز في السواليف ولّقط من هو القناص!</p>
                <button class="btn-primary" id="citizenDoneBtn">تمام، مرر الجهاز ➡️</button>
            </div>
        `;

        document.getElementById('citizenDoneBtn').onclick = () => {
            gameState.currentRevealIndex++;
            processNextReveal();
        };
    }

    function renderDiscussionPhase() {
        app.innerHTML = `
            <div class="game-card">
                <div class="brand-header">وَنَــس</div>
                <h2>🎙️ وقت السواليف والمناقشة</h2>
                <p>الجميع يعرف الفئة الآن! ابدأوا بالحديث والتلميح لمدة دقيقة ونصف.</p>
                <div class="timer" id="discTimer">90</div>
                <button class="btn-primary" id="skipTimerBtn">بدء التصويت فوراً 🗳️</button>
            </div>
        `;

        let timeLeft = 90;
        let timerInterval = setInterval(() => {
            timeLeft--;
            let timerEl = document.getElementById('discTimer');
            if (timerEl) timerEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                startVotingPhase();
            }
        }, 1000);

        document.getElementById('skipTimerBtn').onclick = () => {
            clearInterval(timerInterval);
            startVotingPhase();
        };
    }

    function startVotingPhase() {
        gameState.votingQueue = [...gameState.players];
        gameState.currentVotingIndex = 0;
        processNextVoter();
    }

    function processNextVoter() {
        if (gameState.currentVotingIndex < gameState.votingQueue.length) {
            let currentPlayer = gameState.votingQueue[gameState.currentVotingIndex];
            renderPassDevice(currentPlayer.name, () => {
                if (currentPlayer === gameState.impostor) {
                    renderImpostorVote();
                } else if (currentPlayer === gameState.sniper) {
                    renderSniperVote();
                } else {
                    renderCitizenVote(currentPlayer);
                }
            });
        } else {
            renderRoundSummary();
        }
    }

    function renderImpostorVote() {
        let options = gameState.players.filter(p => p !== gameState.impostor).map(p => `<option value="${p.name}">${p.name}</option>`).join('');
        app.innerHTML = `
            <div class="game-card">
                <h2>تصويت الامبوستر 🕵️‍♂️</h2>
                <p>يا ${gameState.impostor.name}، من تعتقد أنه <strong>القناص</strong>؟</p>
                <select id="impTarget">${options}</select>
                <button class="btn-primary" id="impVoteBtn">تأكيد التصويت 🗳️</button>
            </div>
        `;

        document.getElementById('impVoteBtn').onclick = () => {
            let voted = document.getElementById('impTarget').value;
            if (voted === gameState.sniper.name) {
                gameState.impostor.score += 5;
                gameState.roundSummaryText += `🎯 الامبوستر (${gameState.impostor.name}) حزر القناص صح وكسب 5 نقاط!<br>`;
            } else {
                gameState.roundSummaryText += `❌ الامبوستر أخطأ في حزر القناص.<br>`;
            }
            gameState.currentVotingIndex++;
            processNextVoter();
        };
    }

    function renderSniperVote() {
        let options = gameState.players.filter(p => p !== gameState.sniper).map(p => `<option value="${p.name}">${p.name}</option>`).join('');
        app.innerHTML = `
            <div class="game-card">
                <h2>تصويت القناص 🎯</h2>
                <p>يا ${gameState.sniper.name}، من تعتقد أنه <strong>الامبوستر</strong>؟</p>
                <select id="sniperTarget">${options}</select>
                <button class="btn-primary" id="sniperVoteBtn">تأكيد التصويت 🗳️</button>
            </div>
        `;

        document.getElementById('sniperVoteBtn').onclick = () => {
            let voted = document.getElementById('sniperTarget').value;
            if (voted === gameState.impostor.name) {
                gameState.sniper.score += 5;
                gameState.roundSummaryText += `🎯 القناص (${gameState.sniper.name}) اصطاد الامبوستر وكسب 5 نقاط!<br>`;
            } else {
                gameState.roundSummaryText += `❌ القناص أخطأ في تحديد الامبوستر.<br>`;
            }
            gameState.currentVotingIndex++;
            processNextVoter();
        };
    }

    function renderCitizenVote(citizenPlayer) {
        let options = gameState.players.filter(p => p !== citizenPlayer).map(p => `<option value="${p.name}">${p.name}</option>`).join('');
        app.innerHTML = `
            <div class="game-card">
                <h2>تصويت المواطن 🔍</h2>
                <p>يا ${citizenPlayer.name}، من تعتقد أنه <strong>القناص</strong>؟</p>
                <select id="citizenTarget">${options}</select>
                <button class="btn-primary" id="citVoteBtn">تأكيد التصويت 🗳️</button>
            </div>
        `;

        document.getElementById('citVoteBtn').onclick = () => {
            let voted = document.getElementById('citizenTarget').value;
            if (voted === gameState.sniper.name) {
                citizenPlayer.score += 5;
                gameState.roundSummaryText += `🎉 المواطن (${citizenPlayer.name}) كشف القناص وكسب 5 نقاط!<br>`;
            } else {
                gameState.roundSummaryText += `❌ المواطن (${citizenPlayer.name}) أخطأ في تصويته.<br>`;
            }
            gameState.currentVotingIndex++;
            processNextVoter();
        };
    }

    function renderRoundSummary() {
        let scoresHtml = gameState.players.map(p => `
            <div class="score-item">
                <span>${p.name}</span>
                <span style="color:#facc15;">${p.score} نقطة</span>
            </div>
        `).join('');

        app.innerHTML = `
            <div class="game-card">
                <div class="brand-header">وَنَــس</div>
                <h2>📊 نتائج الجولة ${gameState.currentRound}</h2>
                <div style="background:#005585; padding:15px; border-radius:12px; margin:15px 0; font-size:14px; text-align:right;">
                    <p>${gameState.roundSummaryText}</p>
                    <hr style="border-color:#38bdf8; margin:10px 0;">
                    <p>الفئة: <strong>${gameState.currentCategory}</strong></p>
                    <p>الامبوستر: <strong>${gameState.impostor.name}</strong> (التزم بـ ${gameState.wordsToSay} كلمات)</p>
                    <p>القناص: <strong>${gameState.sniper.name}</strong></p>
                    <p>الكلمات المستخدمة: ${gameState.currentRoundWords.join(', ')}</p>
                </div>
                <h3>النقاط الحالية:</h3>
                <div>${scoresHtml}</div>
                <button class="btn-primary" id="nextRoundBtn">${gameState.currentRound < gameState.totalRounds ? 'الجولة التالية ⬅️' : 'النتيجة النهائية 🏆'}</button>
            </div>
        `;

        document.getElementById('nextRoundBtn').onclick = () => {
            if (gameState.currentRound < gameState.totalRounds) {
                gameState.currentRound++;
                startRound();
            } else {
                renderFinalWinner();
            }
        };
    }

    function renderFinalWinner() {
        let sorted = [...gameState.players].sort((a, b) => b.score - a.score);
        let winner = sorted[0];

        let rankingHtml = sorted.map((p, idx) => `
            <div class="score-item">
                <span>${idx + 1}. ${p.name}</span>
                <span style="color:#facc15;">${p.score} نقطة</span>
            </div>
        `).join('');

        app.innerHTML = `
            <div class="game-card">
                <div class="brand-header">وَنَــس</div>
                <h2>🏆 بطل الجلسة 🏆</h2>
                <p style="font-size:22px; color:#facc15; font-weight:900; margin:15px 0;">مبروك يا ${winner.name}! 🎉</p>
                <h3>الترتيب النهائي:</h3>
                <div>${rankingHtml}</div>
                <button class="btn-primary" id="restartBtn">لعبة جديدة 🔄</button>
            </div>
        `;

        document.getElementById('restartBtn').onclick = () => {
            renderSetup();
        };
    }

    renderSetup();
</script>
</body>
</html>
